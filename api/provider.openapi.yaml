openapi: 3.1.1
info:
  title: Cortex Remote Compute Provider Protocol
  version: 1.0.0
  description: Batch-only compute provider contract. Each submission contains resources, process, deadlines, and
    metadata. Providers preserve supplied environment values, including when rounding resource capacity upward.
    See REMOTE_PROVIDER_PROTOCOL.md for admission, idempotency, retention, and fallback semantics. Providers do
    not interpret c2j or JobDB. Numeric priorities are controller configuration.
servers:
- url: https://provider.example.com
security:
- bearerAuth: []
paths:
  /v1/submit:
    post:
      operationId: submitBatch
      summary: Submit complete launches in one batch
      description: Validate the envelope before processing any items. Size resources and admit each launch in this
        operation. Idempotency is scoped to provider instance, authenticated principal, and launch ID, independent
        of batch membership. During retention, logical retries return the recorded decision; changed request or
        process for an existing ID is rejected without changing its original launch. Retain accepted launches throughout
        their lifetime plus at least 24 hours after termination, and declines for at least 24 hours. After retention,
        callers must not replay old submissions. Definite declines authorize fallback; missing or unknown outcomes
        do not.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitRequest'
            example:
              items:
              - launch_id: launch-001
                image: registry.example/runner:1.2
                platform: linux/amd64
                cpu_millis: 1500
                memory_bytes: 4294967296
                scratch_bytes: 1073741824
                timeout_seconds: 3600
                start_before: '2026-10-01T12:01:00Z'
                metadata: &id001
                  cortex_metadata_version: '1'
                  cortex_managed_by: cortex
                  cortex_jobdb_instance_id: production
                  cortex_tenant_id: acme
                  cortex_job_id: job-123
                  cortex_launch_id: launch-001
                process:
                  command:
                  - c2j
                  args:
                  - run
                  - --job-id
                  - job-123
                  - --worker-id
                  - launch-001
                  - --on-not-ready
                  - fail
                  - --ci
                  - --input-mode
                  - fail
                  env:
                    C2J_JOBDB: https://jobdb.example/acme
                    C2J_EXECUTION_CPU: 1500m
                    C2J_EXECUTION_MEMORY: 4194304Ki
                    C2J_EXECUTION_EPHEMERAL_STORAGE: 1048576Ki
                    C2J_EXECUTION_PLATFORM: linux/amd64
                    C2J_EXECUTION_IMAGE: registry.example/runner:1.2
                    CORTEX_METADATA_VERSION: '1'
                    CORTEX_MANAGED_BY: cortex
                    CORTEX_JOBDB_INSTANCE_ID: production
                    CORTEX_TENANT_ID: acme
                    CORTEX_JOB_ID: job-123
                    CORTEX_LAUNCH_ID: launch-001
              - launch_id: launch-002
                image: registry.example/runner:1.2
                platform: linux/amd64
                cpu_millis: 1500
                memory_bytes: 4294967296
                scratch_bytes: 1073741824
                timeout_seconds: 3600
                start_before: '2026-10-01T12:01:00Z'
                metadata:
                  cortex_metadata_version: '1'
                  cortex_managed_by: cortex
                  cortex_jobdb_instance_id: production
                  cortex_tenant_id: acme
                  cortex_job_id: job-124
                  cortex_launch_id: launch-002
                process:
                  command:
                  - c2j
                  args:
                  - run
                  - --job-id
                  - job-124
                  - --worker-id
                  - launch-002
                  - --on-not-ready
                  - fail
                  - --ci
                  - --input-mode
                  - fail
                  env:
                    C2J_JOBDB: https://jobdb.example/acme
                    C2J_EXECUTION_CPU: 1500m
                    C2J_EXECUTION_MEMORY: 4194304Ki
                    C2J_EXECUTION_EPHEMERAL_STORAGE: 1048576Ki
                    C2J_EXECUTION_PLATFORM: linux/amd64
                    C2J_EXECUTION_IMAGE: registry.example/runner:1.2
                    CORTEX_METADATA_VERSION: '1'
                    CORTEX_MANAGED_BY: cortex
                    CORTEX_JOBDB_INSTANCE_ID: production
                    CORTEX_TENANT_ID: acme
                    CORTEX_JOB_ID: job-124
                    CORTEX_LAUNCH_ID: launch-002
      responses:
        '200':
          description: Complete per-item results. Mixed outcomes are normal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitResponse'
              example:
                results:
                - launch_id: launch-001
                  status: accepted
                  inspection_uri: /v1/launches/launch-001
                  refs: []
                - launch_id: launch-002
                  status: no_capacity
                  reason: No compatible runner slot available.
        '400':
          description: Malformed request or duplicate launch IDs. No items processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: duplicate_launch_id
                message: Each launch_id must be unique within a batch; no items were processed.
        '401':
          description: Authentication failed before processing any items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Batch authorization denied before processing any items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request too large. No items processed; maximum batch size is 100.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Request schema validation failed. No items processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected failure. For submission, acceptance of unreported items is uncertain; no immediate
            fallback.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/launches/{launch_id}:
    get:
      operationId: getLaunch
      summary: Inspect a launch and its correlation metadata
      description: Diagnostic lookup, including before runner assignment. A missing record is not evidence that
        a submission never ran.
      parameters:
      - name: launch_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/LaunchId'
      responses:
        '200':
          description: Launch record owned by this principal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaunchRecord'
              example:
                launch_id: launch-001
                state: running
                metadata: *id001
                allocation:
                  cpu_millis: 2000
                  memory_bytes: 4294967296
                  scratch_bytes: 1073741824
                  platform: linux/amd64
                  image: registry.example/runner:1.2
                refs:
                - runner-pool/runner-17/containers/container-456
                accepted_at: '2026-10-01T12:00:00Z'
                started_at: '2026-10-01T12:00:05Z'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Access denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No inspectable record; may be absent or past retention.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Inspection failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    LaunchId:
      type: string
      pattern: ^[A-Za-z0-9._-]{1,128}$
      description: Unique per launch attempt. Scoped by provider instance and authenticated principal; stable across
        fallback within the attempt.
    Metadata:
      type: object
      minProperties: 1
      additionalProperties:
        type: string
      description: Opaque exact correlation envelope. Preserve it on the launch record before execution can start.
        Do not place credentials here.
    Allocation:
      type: object
      properties:
        cpu_millis:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: Usable CPU in millicores; 1000 is one vCPU.
        memory_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: Usable application memory, available simultaneously with scratch.
        scratch_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: Usable ephemeral workspace capacity, available simultaneously with memory.
        platform:
          type: string
          minLength: 1
        image:
          type: string
          minLength: 1
          description: Launch image reference whose meaning must be preserved when binding to content.
        image_digest:
          type: string
          minLength: 1
          description: Verified OCI manifest digest, if known. Distinct from image/config ID.
        image_id:
          type: string
          minLength: 1
          description: Runtime image/config ID if known; diagnostic only.
      required:
      - cpu_millis
      - memory_bytes
      - scratch_bytes
      - platform
      - image
      additionalProperties: true
      description: Provider-enforced usable allocation, at least the requested capacities. Queued records describe
        the allocation promised before assignment. This diagnostic field does not change the submitted environment.
    DeclinedResult:
      type: object
      properties:
        launch_id:
          $ref: '#/components/schemas/LaunchId'
        status:
          type: string
          enum:
          - no_capacity
          - unsupported
          - unavailable
          - rejected
        reason:
          type: string
          minLength: 1
          description: Diagnostic reason. Fallback depends on status, never text matching.
      required:
      - launch_id
      - status
      - reason
      additionalProperties: true
    ProcessSpec:
      type: object
      properties:
        command:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
          description: Explicit executable and optional entrypoint arguments; no implicit shell interpretation.
        args:
          type: array
          items:
            type: string
        env:
          type: object
          additionalProperties:
            type: string
          description: Literal supplied values override image and provider defaults. Preserve exact values; no substitution
            or changes based on provider sizing. Do not log secrets.
        working_dir:
          type: string
          minLength: 1
          description: Absolute container path. If omitted, use the image working directory.
      required:
      - command
      - args
      - env
      additionalProperties: false
    AcceptedResult:
      type: object
      properties:
        launch_id:
          $ref: '#/components/schemas/LaunchId'
        status:
          type: string
          enum:
          - accepted
        inspection_uri:
          type: string
          format: uri-reference
          description: URI for the authenticated launch inspection endpoint, relative to this service or same-origin
            absolute.
        refs:
          type: array
          items:
            type: string
            minLength: 1
          description: Known native resource/operation references; may be empty before assignment.
      required:
      - launch_id
      - status
      - inspection_uri
      - refs
      additionalProperties: true
    UnknownResult:
      type: object
      properties:
        launch_id:
          $ref: '#/components/schemas/LaunchId'
        status:
          type: string
          enum:
          - unknown
        reason:
          type: string
          minLength: 1
        refs:
          type: array
          items:
            type: string
            minLength: 1
      required:
      - launch_id
      - status
      - reason
      additionalProperties: true
    SubmissionResult:
      oneOf:
      - $ref: '#/components/schemas/AcceptedResult'
      - $ref: '#/components/schemas/DeclinedResult'
      - $ref: '#/components/schemas/UnknownResult'
    SubmitRequest:
      type: object
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/Launch'
      required:
      - items
      additionalProperties: false
    SubmitResponse:
      type: object
      properties:
        results:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/SubmissionResult'
      required:
      - results
      additionalProperties: true
    LaunchRecord:
      type: object
      properties:
        launch_id:
          $ref: '#/components/schemas/LaunchId'
        state:
          type: string
          enum:
          - queued
          - starting
          - running
          - succeeded
          - failed
          - timed_out
          - expired
          - cancelled
          - unknown
          description: Provider execution state; succeeded does not assert application/job completion.
        metadata:
          $ref: '#/components/schemas/Metadata'
        allocation:
          $ref: '#/components/schemas/Allocation'
        refs:
          type: array
          items:
            type: string
            minLength: 1
        accepted_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        reason:
          type: string
      required:
      - launch_id
      - state
      - metadata
      - allocation
      - refs
      - accepted_at
      additionalProperties: true
    Error:
      type: object
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
      required:
      - code
      - message
      additionalProperties: true
    Launch:
      type: object
      properties:
        launch_id:
          $ref: '#/components/schemas/LaunchId'
        image:
          type: string
          minLength: 1
          description: OCI launch reference, including tag or digest as required.
        platform:
          type: string
          minLength: 1
          description: Normalized OCI os/architecture[/variant].
        cpu_millis:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: Usable CPU in millicores; 1000 is one vCPU.
        memory_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: Usable application memory, available simultaneously with scratch.
        scratch_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: Usable ephemeral workspace capacity, available simultaneously with memory.
        timeout_seconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 31536000
          description: Maximum execution duration after container startup.
        start_before:
          type: string
          format: date-time
          description: Optional latest container startup time. Required if the provider queues the launch; not the
            execution deadline.
        metadata:
          $ref: '#/components/schemas/Metadata'
        process:
          $ref: '#/components/schemas/ProcessSpec'
      required:
      - launch_id
      - image
      - platform
      - cpu_millis
      - memory_bytes
      - scratch_bytes
      - timeout_seconds
      - metadata
      - process
      additionalProperties: false
      description: Complete immutable launch request. Resource quantities are minimum usable capacities the provider
        must guarantee simultaneously. Provider sizing may round upward without changing the supplied process or
        environment.
