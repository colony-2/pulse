openapi: 3.1.1
info:
  title: Cortex Remote Compute Provider Protocol
  version: 1.0.0
  description: Batch-only compute provider contract. Each submission contains resources, process, deadlines, and
    metadata. Providers preserve supplied environment values, including when rounding resource capacity upward.
    See REMOTE_PROVIDER_PROTOCOL.md for single-attempt submission, recovery, and fallback semantics. Providers do
    not interpret c2j or JobDB. Numeric priorities are controller configuration.
servers:
- url: https://provider.example.com
security:
- bearerAuth: []
paths:
  /v1/submit:
    post:
      operationId: submitBatch
      summary: Submit complete launches in one batch
      description: Validate the envelope before processing any items. Size resources and admit each launch in this
        operation. Callers submit each attempt once to a selected service and must not replay a POST after an
        uncertain response. Providers attempt native handoff once without retrying ambiguous starts; distinct
        create/start operations and provisioning reads are allowed. Disable automatic submission retries in clients,
        proxies, and launch SDKs. Accepted means admission to a bounded provider queue or handoff to the underlying
        runtime, not guaranteed startup or completion. Providers need no durable submission journal, replay support,
        stored decline decisions, fixed terminal retention, or recovery loop for lost launches. Native idempotency
        safeguards are optional. Definite declines authorize fallback; missing or unknown outcomes do not.
        Outstanding work is rediscovered through c2j; a later Cortex attempt after cooldown has a new launch ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitRequest'
            example:
              items:
              - launch_id: launch-001
                image: registry.example/runner:1.2
                platform: linux/amd64
                cpu_millis: 1500
                memory_bytes: 4294967296
                scratch_bytes: 1073741824
                timeout_seconds: 3600
                start_before: '2026-10-01T12:01:00Z'
                metadata:
                  cortex_metadata_version: '1'
                  cortex_managed_by: cortex
                  cortex_jobdb_instance_id: production
                  cortex_tenant_id: acme
                  cortex_job_id: job-123
                  cortex_launch_id: launch-001
                process:
                  command:
                  - c2j
                  args:
                  - run
                  - --job-id
                  - job-123
                  - --worker-id
                  - launch-001
                  - --on-not-ready
                  - fail
                  - --ci
                  - --input-mode
                  - fail
                  env:
                    C2J_JOBDB: https://jobdb.example/acme
                    C2J_EXECUTION_CPU: 1500m
                    C2J_EXECUTION_MEMORY: 4194304Ki
                    C2J_EXECUTION_EPHEMERAL_STORAGE: 1048576Ki
                    C2J_EXECUTION_PLATFORM: linux/amd64
                    C2J_EXECUTION_IMAGE: registry.example/runner:1.2
                    CORTEX_METADATA_VERSION: '1'
                    CORTEX_MANAGED_BY: cortex
                    CORTEX_JOBDB_INSTANCE_ID: production
                    CORTEX_TENANT_ID: acme
                    CORTEX_JOB_ID: job-123
                    CORTEX_LAUNCH_ID: launch-001
              - launch_id: launch-002
                image: registry.example/runner:1.2
                platform: linux/amd64
                cpu_millis: 1500
                memory_bytes: 4294967296
                scratch_bytes: 1073741824
                timeout_seconds: 3600
                start_before: '2026-10-01T12:01:00Z'
                metadata:
                  cortex_metadata_version: '1'
                  cortex_managed_by: cortex
                  cortex_jobdb_instance_id: production
                  cortex_tenant_id: acme
                  cortex_job_id: job-124
                  cortex_launch_id: launch-002
                process:
                  command:
                  - c2j
                  args:
                  - run
                  - --job-id
                  - job-124
                  - --worker-id
                  - launch-002
                  - --on-not-ready
                  - fail
                  - --ci
                  - --input-mode
                  - fail
                  env:
                    C2J_JOBDB: https://jobdb.example/acme
                    C2J_EXECUTION_CPU: 1500m
                    C2J_EXECUTION_MEMORY: 4194304Ki
                    C2J_EXECUTION_EPHEMERAL_STORAGE: 1048576Ki
                    C2J_EXECUTION_PLATFORM: linux/amd64
                    C2J_EXECUTION_IMAGE: registry.example/runner:1.2
                    CORTEX_METADATA_VERSION: '1'
                    CORTEX_MANAGED_BY: cortex
                    CORTEX_JOBDB_INSTANCE_ID: production
                    CORTEX_TENANT_ID: acme
                    CORTEX_JOB_ID: job-124
                    CORTEX_LAUNCH_ID: launch-002
      responses:
        '200':
          description: Complete per-item results. Mixed outcomes are normal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitResponse'
              example:
                results:
                - launch_id: launch-001
                  status: accepted
                - launch_id: launch-002
                  status: no_capacity
                  reason: No compatible runner slot available.
        '400':
          description: Malformed request or duplicate launch IDs. No items processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: duplicate_launch_id
                message: Each launch_id must be unique within a batch; no items were processed.
        '401':
          description: Authentication failed before processing any items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Batch authorization denied before processing any items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request too large. No items processed; maximum batch size is 100.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Request schema validation failed. No items processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected failure. For submission, acceptance of unreported items is uncertain; no immediate
            fallback.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/launches:
    get:
      operationId: listInstances
      summary: List active instances owned by the authenticated principal
      description: Includes queued, starting, running, paused, and stopping instances; excludes terminal instances.
        Results may change between pages and may lag native state. An empty page can carry a continuation token.
        Absence is not proof of non-acceptance. This read-only operation does not change scheduling or capacity.
      parameters:
      - name: page_size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
      - name: page_token
        in: query
        schema:
          type: string
          maxLength: 16384
        description: Opaque continuation token; keep other filters unchanged.
      - name: launch_id
        in: query
        schema:
          $ref: '#/components/schemas/LaunchId'
        description: Optional exact launch filter. Still returns a collection of active instances.
      responses:
        '200':
          description: One page of active instances. Follow next_page_token even if items is empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
              example:
                items:
                - id: instance-001
                  launch_id: launch-001
                  state: running
                  metadata:
                    cortex_metadata_version: '1'
                    cortex_managed_by: cortex
                    cortex_jobdb_instance_id: production
                    cortex_tenant_id: acme
                    cortex_job_id: job-123
                    cortex_launch_id: launch-001
                  refs:
                  - runner-pool/runner-17/containers/container-456
                  created_at: '2026-10-01T12:00:00Z'
                  started_at: '2026-10-01T12:00:05Z'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Access denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Listing failed; failure must not be represented as an empty successful page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Invalid list parameters or cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    LaunchId:
      type: string
      pattern: ^[A-Za-z0-9._-]{1,128}$
      description: Unique per launch attempt. Scoped by provider instance and authenticated principal; stable across
        fallback within the attempt.
    Metadata:
      type: object
      minProperties: 1
      additionalProperties:
        type: string
      description: Opaque exact correlation envelope. Attach it to native resources or queue entries before execution can start.
        Do not place credentials here.
    DeclinedResult:
      type: object
      properties:
        launch_id:
          $ref: '#/components/schemas/LaunchId'
        status:
          type: string
          enum:
          - no_capacity
          - unsupported
          - unavailable
          - rejected
        reason:
          type: string
          minLength: 1
          description: Diagnostic reason. Fallback depends on status, never text matching.
      required:
      - launch_id
      - status
      - reason
      additionalProperties: true
    ProcessSpec:
      type: object
      properties:
        command:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
          description: Explicit executable and optional entrypoint arguments; no implicit shell interpretation.
        args:
          type: array
          items:
            type: string
        env:
          type: object
          additionalProperties:
            type: string
          description: Literal supplied values override image and provider defaults. Preserve exact values; no substitution
            or changes based on provider sizing. Do not log secrets.
        working_dir:
          type: string
          minLength: 1
          description: Absolute container path. If omitted, use the image working directory.
      required:
      - command
      - args
      - env
      additionalProperties: false
    AcceptedResult:
      type: object
      description: Admission or native handoff occurred. Startup and completion are not guaranteed; the provider
        is not required to recover a lost or failed launch.
      properties:
        launch_id:
          $ref: '#/components/schemas/LaunchId'
        status:
          type: string
          enum:
          - accepted
      required:
      - launch_id
      - status
      additionalProperties: true
    UnknownResult:
      type: object
      properties:
        launch_id:
          $ref: '#/components/schemas/LaunchId'
        status:
          type: string
          enum:
          - unknown
        reason:
          type: string
          minLength: 1
      required:
      - launch_id
      - status
      - reason
      additionalProperties: true
    SubmissionResult:
      oneOf:
      - $ref: '#/components/schemas/AcceptedResult'
      - $ref: '#/components/schemas/DeclinedResult'
      - $ref: '#/components/schemas/UnknownResult'
    SubmitRequest:
      type: object
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/Launch'
      required:
      - items
      additionalProperties: false
    SubmitResponse:
      type: object
      properties:
        results:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/SubmissionResult'
      required:
      - results
      additionalProperties: true
    Error:
      type: object
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
      required:
      - code
      - message
      additionalProperties: true
    Launch:
      type: object
      properties:
        launch_id:
          $ref: '#/components/schemas/LaunchId'
        image:
          type: string
          minLength: 1
          description: OCI launch reference, including tag or digest as required.
        platform:
          type: string
          minLength: 1
          description: Normalized OCI os/architecture[/variant].
        cpu_millis:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: Usable CPU in millicores; 1000 is one vCPU.
        memory_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: Usable application memory, available simultaneously with scratch.
        scratch_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: Usable ephemeral workspace capacity, available simultaneously with memory.
        timeout_seconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 31536000
          description: Maximum execution duration after container startup.
        start_before:
          type: string
          format: date-time
          description: Optional latest actual container startup time. Required for a provider-owned runner queue;
            prompt handoff followed by native scheduling or image-pull delays does not require this field.
            If supplied it must be enforced at startup, not just handoff; return unsupported if that is impossible.
            This is separate from the execution deadline.
        metadata:
          $ref: '#/components/schemas/Metadata'
        process:
          $ref: '#/components/schemas/ProcessSpec'
      required:
      - launch_id
      - image
      - platform
      - cpu_millis
      - memory_bytes
      - scratch_bytes
      - timeout_seconds
      - metadata
      - process
      additionalProperties: false
      description: Complete immutable launch request. Resource quantities are minimum usable capacities the provider
        must guarantee simultaneously. Provider sizing may round upward without changing the supplied process or
        environment.
    Instance:
      type: object
      description: Active provider instance. Terminal instances are excluded; one launch can have multiple native
        instances.
      properties:
        id:
          type: string
          minLength: 1
          description: Stable instance identity within this configured provider.
        launch_id:
          $ref: '#/components/schemas/LaunchId'
        state:
          type: string
          enum:
          - queued
          - starting
          - running
          - paused
          - stopping
        metadata:
          $ref: '#/components/schemas/Metadata'
        refs:
          type: array
          items:
            type: string
            minLength: 1
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
      required:
      - id
      - launch_id
      - state
      - metadata
      - refs
      additionalProperties: true
    ListResponse:
      type: object
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Instance'
        next_page_token:
          type: string
          minLength: 1
          maxLength: 16384
      required:
      - items
      additionalProperties: true
