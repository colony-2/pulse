name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing vMAJOR.MINOR.PATCH tag to retry (leave empty for a new release)'
        required: false
        type: string

# Serialize releases to avoid concurrent publication and image promotion.
concurrency:
  group: pulse-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  GO_VERSION: '1.26.1'
  NODE_VERSION: '24'

jobs:
  test:
    if: github.repository_owner == 'colony-2'
    uses: ./.github/workflows/test.yaml

  create-tag:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump version and push tag (same policy as c2j)
        id: bump
        if: inputs.tag == ''
        uses: anothrNick/github-tag-action@1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
          WITH_V: 'true'
          PRERELEASE: 'false'
          RELEASE_BRANCHES: main
      - name: Validate release tag
        id: meta
        env:
          REQUESTED_TAG: ${{ inputs.tag || steps.bump.outputs.new_tag }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --tags
          git rev-parse --verify "refs/tags/$REQUESTED_TAG^{commit}"
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${REQUESTED_TAG#v}" >> "$GITHUB_OUTPUT"

  darwin:
    needs: create-tag
    runs-on: macos-15
    env:
      VERSION: ${{ needs.create-tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-tag.outputs.tag }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build Darwin executables
        run: scripts/build-release.sh "$VERSION" darwin/amd64 darwin/arm64
      - name: Sign and notarize with Developer ID when configured
        env:
          SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          NOTARY_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          NOTARY_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          required=(SIGN_P12 SIGN_PASSWORD NOTARY_ISSUER NOTARY_KEY_ID NOTARY_KEY)
          present=0
          for name in "${required[@]}"; do
            if [[ -n "${!name}" ]]; then present=$((present + 1)); fi
          done
          if [[ "$present" -eq 0 ]]; then
            exit 0
          elif [[ "$present" -ne "${#required[@]}" ]]; then
            echo 'Configure all five Apple signing secrets, or none.' >&2
            exit 1
          fi

          signing_dir=$(mktemp -d)
          keychain="$signing_dir/signing.keychain-db"
          trap 'security delete-keychain "$keychain" 2>/dev/null || true; rm -rf "$signing_dir"' EXIT
          printf '%s' "$SIGN_P12" | base64 -D > "$signing_dir/certificate.p12"
          if [[ "$NOTARY_KEY" == '-----BEGIN '* ]]; then
            printf '%s\n' "$NOTARY_KEY" > "$signing_dir/notary.p8"
          else
            printf '%s' "$NOTARY_KEY" | base64 -D > "$signing_dir/notary.p8"
          fi
          keychain_password=$(openssl rand -hex 32)
          security create-keychain -p "$keychain_password" "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$signing_dir/certificate.p12" -k "$keychain" -P "$SIGN_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          codesign --force --sign 'Developer ID Application' --keychain "$keychain" \
            --options runtime --timestamp dist/build/darwin-amd64/pulse
          codesign --force --sign 'Developer ID Application' --keychain "$keychain" \
            --options runtime --timestamp --entitlements cmd/pulse/vz.entitlements dist/build/darwin-arm64/pulse

          (cd dist/build && zip -q "$signing_dir/notary.zip" darwin-amd64/pulse darwin-arm64/pulse)
          xcrun notarytool submit "$signing_dir/notary.zip" --wait --output-format json \
            --key "$signing_dir/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" \
            | tee "$signing_dir/notary-result.json"
          jq -e '.status == "Accepted"' "$signing_dir/notary-result.json" >/dev/null
      - name: Verify and stage Darwin executables
        run: |
          codesign --verify --strict dist/build/darwin-arm64/pulse
          tar -C dist/build -cf darwin-executables.tar darwin-amd64 darwin-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: darwin-executables
          path: darwin-executables.tar
          if-no-files-found: error

  build:
    needs: [create-tag, darwin]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ needs.create-tag.outputs.tag }}
      VERSION: ${{ needs.create-tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-tag.outputs.tag }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check module tidiness
        run: go mod tidy -diff
      - name: Build Linux executables
        run: scripts/build-release.sh "$VERSION" linux/amd64 linux/arm64
      - uses: actions/download-artifact@v4
        with:
          name: darwin-executables
      - name: Extract signed Darwin executables
        run: tar -xf darwin-executables.tar -C dist/build
      - name: Pack executable archives and npm artifact
        run: |
          scripts/package-release.sh "$VERSION"
          node scripts/smoke-npm.js "$VERSION"
      - name: Record pinned c2j library version
        run: |
          set -euo pipefail
          c2j_version="$(go list -m -f '{{.Version}}' github.com/colony-2/c2j)"
          echo "C2J_VERSION=$c2j_version" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build and smoke-test both distroless images
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/$arch" --load \
              --build-arg "VERSION=$VERSION" --build-arg "REVISION=$(git rev-parse HEAD)" \
              --tag "$image:$TAG-$arch" .
            scripts/smoke-container.sh "$image:$TAG-$arch" "$VERSION" "linux/$arch"
            docker save "$image:$TAG-$arch" | gzip > "dist/release/pulse_${VERSION}_container_Linux_${arch}.tar.gz"
          done
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish versioned multi-architecture image
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do docker push "$IMAGE:$TAG-$arch"; done
          docker buildx imagetools create --tag "$IMAGE:$TAG" "$IMAGE:$TAG-amd64" "$IMAGE:$TAG-arm64"
          docker buildx imagetools inspect "$IMAGE:$TAG" > dist/release/container-image.txt
          {
            echo "Pulse: $TAG"
            echo "c2j Go library: $C2J_VERSION"
            echo "Image: $IMAGE:$TAG"
            echo "Source: $(git rev-parse HEAD)"
          } > dist/release/versions.txt
          {
            echo '## Container image'
            echo
            echo "\`$IMAGE:$TAG\` — Linux AMD64 and ARM64, embedding c2j listing library \`$C2J_VERSION\`."
            echo
            echo 'The release assets include the npm package, native executable archives, and per-architecture container archives for `docker load`.'
          } > dist/release/release-notes.md
          cd dist/release
          sha256sum ./*.tar.gz ./*.tgz container-image.txt versions.txt | sed 's|  ./|  |' | sort -k2 > checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

  github-release:
    needs: [create-tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist/release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-tag.outputs.tag }}
          name: Pulse ${{ needs.create-tag.outputs.tag }}
          generate_release_notes: true
          body_path: dist/release/release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/release/*.tar.gz
            dist/release/*.tgz
            dist/release/checksums.txt
            dist/release/container-image.txt
            dist/release/versions.txt

  npm:
    needs: [create-tag, github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      VERSION: ${{ needs.create-tag.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist/release
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11
      - name: Test real npm install from published GitHub assets
        run: |
          set -euo pipefail
          install_dir="$(mktemp -d)"
          npm install --prefix "$install_dir" "$PWD/dist/release/colony2-pulse-$VERSION.tgz"
          [[ "$("$install_dir/node_modules/.bin/pulse" version)" == "pulse version $VERSION" ]]
      - name: Publish exact GitHub npm artifact with token
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
        run: npm publish "dist/release/colony2-pulse-$VERSION.tgz" --access public --provenance
      - name: Publish exact GitHub npm artifact with trusted publishing
        if: env.NPM_TOKEN == ''
        run: npm publish "dist/release/colony2-pulse-$VERSION.tgz" --access public --provenance

  latest-image:
    needs: [create-tag, npm]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      TAG: ${{ needs.create-tag.outputs.tag }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote successful release to latest
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create --tag "$image:latest" "$image:$TAG"
