name: Test
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: make test vet build
      - run: node --test scripts/npm.test.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install 'openapi-spec-validator==0.9.0' 'PyYAML==6.0.3'
      - run: python scripts/validate_protocol.py
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: scripts/build-release.sh 0.0.0
      - run: scripts/package-release.sh 0.0.0
      - run: node scripts/smoke-npm.js 0.0.0
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Test both image architectures
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/$arch" --load \
              --build-arg VERSION=0.0.0 --tag "cortex:test-$arch" .
            scripts/smoke-container.sh "cortex:test-$arch" 0.0.0 "linux/$arch"
          done
