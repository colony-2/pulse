# A Tart-only host does not require Docker. Local Tart requires Apple Silicon macOS.
defaults:
  base: 'macos*'
providers:
  mac:
    type: tart
    config:
      slots:
        - name: standard
          count: 4
          base: macos-sequoia-15.7.7-arm64
          cpu: 4
          memory_mib: 8192
      # tart: {binary: /opt/homebrew/bin/tart, home: /Users/me/.tart}
      # state_dir: /Users/me/Library/Application Support/pulse/my-tart-state
targets:
  - jobdb: https://jobdb.example/acme
    launch_services: [{name: mac, priority: 1}]
