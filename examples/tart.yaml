# A Tart-only host does not require Docker. Local Tart requires Apple Silicon macOS.
defaults:
  base: 'macos*'
providers:
  mac:
    type: tart
    # No config is required: pulse-tart supplies its VM and Linux Docker defaults.
    # config:
    #   vm_counts: {macos: 1, linux: 2, total: 2}
targets:
  - jobdb: https://jobdb.example/acme
    launch_services: [{name: mac, priority: 1}]
