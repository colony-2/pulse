# Optional subprocess listing. Install c2j separately or build the
# Dockerfile's external-c2j target. Executor job images always need c2j run.
c2j:
  mode: external
  executable: c2j
  # expected_version: c2j version <your-version>
  # working_dir: /srv/cortex
poll_interval: 5s
cooldown: 60s
defaults:
  image: registry.example/c2j-runner:1.0
  platform: linux/amd64
  cpu: "1"
  memory: 1Gi
  scratch: 1Gi
providers:
  runners:
    type: remote
    endpoint: https://runners.example.com
    token_env: CORTEX_PROVIDER_TOKEN
targets:
  - instance_id: production
    jobdb: https://jobdb.example.com/acme
    cells: [github.com/acme/app]
    launch_services: [{name: runners, priority: 1}]
