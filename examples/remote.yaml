poll_interval: 5s
cooldown: 60s
call_timeout: 30s
batch_timeout: 2m
batch_size: 100
max_jobs_per_cell: 100
defaults:
  image: registry.example/c2j-runner:1.0
  platform: linux/amd64
  cpu: "1"
  memory: 1Gi
  scratch: 1Gi
  timeout: 1h
providers:
  runners:
    type: remote
    endpoint: https://runners.example.com
    token_env: PULSE_PROVIDER_TOKEN
targets:
  - instance_id: production
    jobdb: https://jobdb.example.com/acme
    cells: [github.com/acme/api, github.com/acme/worker]
    launch_services:
      - name: runners
        priority: 1
