# Optional: Pulse uses Docker and base selector ubuntu-26* by default (native architecture first).
# Ubuntu 26.04 bases use ghcr.io/colony-2/base2:latest on the selected architecture.
# Without this file, the tenant comes from C2J_JOBDB or .c2/config.yaml.
# Only pulse is needed on the host; c2j comes from the executor image.
targets:
  - jobdb: http://jobdb.example.com/test-tenant
