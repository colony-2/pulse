# VZ requires macOS 14 or later on Apple Silicon. This setup runs without host Docker.
defaults:
  base: 'macos*'
providers:
  mac:
    type: vz
    # No config is required: pulse-macvz supplies its VM and Linux Docker defaults.
    # config:
    #   vm_counts: {macos: 1, linux: 2, total: 2}
targets:
  - jobdb: https://jobdb.example/acme
    launch_services: [{name: mac, priority: 1}]
