- id: missing-log
  type: integration_case
  runtime: *id011
  inputs: *id003
  mocks:
    ops:
    - match: &id013
        op: command_execution
        node_path: pulse-bounded-caller/invoke_hook/pulse-native-verify/native_race
      behavior:
        mode: return
        outputs:
          stdout: passed
          success: true
          exit_code: 0
          diagnostics: {}
